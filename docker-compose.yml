services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: olx
      POSTGRES_PASSWORD: olx
      POSTGRES_DB: olx_bot
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U olx -d olx_bot"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
