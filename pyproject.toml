[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "olx-filter-bot"
version = "0.1.0"
description = "Serverless Telegram bot that watches OLX.ua search filters and sends new adverts"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.13,<4",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "selectolax>=0.3.21",
    "sqlalchemy[asyncio]>=2.0.35,<2.2",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "uvicorn>=0.30",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.vercel]
entrypoint = "src.asgi:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "migrations"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "ASYNC", "S", "SIM", "C4", "PT", "RUF", "T20", "TID", "PL", "ERA"]
ignore = ["PLR0913", "PLR2004", "PLR0911", "RUF012", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603", "S607", "PLR0915"]
"tests/helpers/telegram.py" = ["ASYNC109"]
"migrations/**" = ["N999"]
"src/infrastructure/config/**" = ["S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
